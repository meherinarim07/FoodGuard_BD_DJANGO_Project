{% extends 'base.html' %}
{% block title %}New awareness post | {{ block.super }}{% endblock %}
{% block content %}
<div class="form-card fg-card card-pad">
    <h3 class="page-title"><i class="bi bi-megaphone"></i> New awareness post</h3>
    <p class="page-sub">Share a food safety tip with the community.</p>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% include 'partials/form_fields.html' %}
        <button type="submit" class="btn btn-fg">Submit</button>
        <a href="{% url 'awareness' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
