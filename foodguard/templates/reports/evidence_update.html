{% extends 'base.html' %}
{% block title %}Edit evidence | {{ block.super }}{% endblock %}
{% block content %}
<div class="form-card fg-card card-pad">
    <h3 class="page-title"><i class="bi bi-pencil-square"></i> Edit evidence</h3>
    <p class="page-sub">Change the photo or the caption.</p>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% include 'partials/form_fields.html' %}
        <button type="submit" class="btn btn-fg">Submit</button>
        <a href="{% url 'report_detail' evidence.report.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
