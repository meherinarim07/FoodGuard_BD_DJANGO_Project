{% extends 'base.html' %}
{% block title %}New food report | {{ block.super }}{% endblock %}
{% block content %}
<div class="form-card fg-card card-pad">
    <h3 class="page-title"><i class="bi bi-flag"></i> New food report</h3>
    <p class="page-sub">Tell us what went wrong. You can add photo evidence on the next step.</p>
    <form method="post">
        {% csrf_token %}
        {% include 'partials/form_fields.html' %}
        <button type="submit" class="btn btn-fg">Submit</button>
        <a href="{% url 'reports' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
