{% extends 'base.html' %}
{% block title %}Upload evidence | {{ block.super }}{% endblock %}
{% block content %}
<div class="form-card fg-card card-pad">
    <h3 class="page-title"><i class="bi bi-camera"></i> Upload evidence</h3>
    <p class="page-sub">A clear photo helps verifiers decide faster.</p>
    <p class="small text-muted">Report: <b>{{ report }}</b></p>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% include 'partials/form_fields.html' %}
        <button type="submit" class="btn btn-fg">Submit</button>
        <a href="{% url 'report_detail' report.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
