{% extends 'base.html' %}
{% block title %}Delete | {{ block.super }}{% endblock %}
{% block content %}
<div class="form-card fg-card card-pad">
    <h3 class="page-title text-danger"><i class="bi bi-trash"></i> Delete post</h3>
    <p>Are you sure you want to delete this post: <b>{{ post }}</b>?</p>
    <form method="post" onsubmit="return confirm('Are you sure?')">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'post_detail' post.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
