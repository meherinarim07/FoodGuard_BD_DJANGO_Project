{% extends 'base.html' %}
{% block title %}Edit profile | {{ block.super }}{% endblock %}
{% block content %}
<div class="form-card fg-card card-pad">
    <h3 class="page-title"><i class="bi bi-pencil-square"></i> Edit profile</h3>
    <p class="page-sub">Update your phone number and area. Area alerts are shown by area.</p>
    <form method="post">
        {% csrf_token %}
        {% include 'partials/form_fields.html' %}
        <button type="submit" class="btn btn-fg">Submit</button>
        <a href="{% url 'profile' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
