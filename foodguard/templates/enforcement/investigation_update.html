{% extends 'base.html' %}
{% block title %}Update investigation | {{ block.super }}{% endblock %}
{% block content %}
<div class="form-card fg-card card-pad">
    <h3 class="page-title"><i class="bi bi-pencil-square"></i> Update investigation</h3>
    <p class="page-sub">Record the action taken and the current status.</p>
    <form method="post">
        {% csrf_token %}
        {% include 'partials/form_fields.html' %}
        <button type="submit" class="btn btn-fg">Submit</button>
        <a href="{% url 'investigation_detail' investigation.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
