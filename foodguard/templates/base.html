
<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FoodGuard BD{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/base.css' %}" rel="stylesheet">
    <link href="{% static 'css/home.css' %}" rel="stylesheet">
    <link href="{% static 'css/pages.css' %}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Starter navbar: Member 3 will replace this with the full navbar -->
    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">FoodGuard BD</a>
        </div>
    </nav>

    {% block banner %}{% endblock %}

    {% block main %}
    <main class="container my-4 flex-grow-1">
        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    {% endblock %}

    <!-- Starter footer: Member 3 will complete it -->
    <footer class="text-center py-3 border-top">FoodGuard BD</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
